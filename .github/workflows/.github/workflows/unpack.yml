
name: Unpack MONOWORLD starter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract starter project
        run: |
          unzip -o monoworld-starter.zip -d /tmp/starter
          cp -R /tmp/starter/monoworld/. .
          rm monoworld-starter.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add MONOWORLD starter source"
          git push
